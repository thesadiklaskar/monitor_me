services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monitor_me}
      POSTGRES_USER: ${POSTGRES_USER:-monitor_me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8.10.3
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local_only_change_me}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  clickhouse:
    image: "${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8.44.3}"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor_me
      CLICKHOUSE_USER: monitor_me
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-local_only_change_me}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/usr/local/bin/monitor-me-migrate"]
    restart: "no"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-monitor_me}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-monitor_me}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      SERVICE_VERSION: "0.1.0-dev"
      MONITOR_ME_AUTH_DISABLED: "${MONITOR_ME_AUTH_DISABLED:-true}"
      DATABASE_URL: "postgres://${POSTGRES_USER:-monitor_me}:${POSTGRES_PASSWORD:-local_only_change_me}@postgres:5432/${POSTGRES_DB:-monitor_me}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-local_only_change_me}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "monitor_me"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-local_only_change_me}"
      WEB_ALLOWED_ORIGINS: "${WEB_ALLOWED_ORIGINS:-http://localhost:3000}"
      REMOTE_ALLOWED_SYSTEMD_UNITS: "${REMOTE_ALLOWED_SYSTEMD_UNITS:-}"
      AGENT_GRPC_ADDR: ":8443"
      AGENT_TLS_CERT_FILE: "/run/certs/server.crt"
      AGENT_TLS_KEY_FILE: "/run/certs/server.key"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
      - "127.0.0.1:${AGENT_GRPC_PORT:-8443}:8443"
    volumes:
      - ./.data/certs:/run/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  agent-artifacts:
    build:
      context: .
      dockerfile: deploy/agent-artifacts/Dockerfile
    restart: "no"
    environment:
      MONITOR_AGENT_VERSION: "${MONITOR_AGENT_VERSION:-0.1.0-dev}"
    volumes:
      - agent_artifacts:/out

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONITOR_ME_AUTH_DISABLED: "${MONITOR_ME_AUTH_DISABLED:-true}"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MONITOR_ME_API_BASE_URL: "http://api:8080"
      MONITOR_ME_AGENT_GRPC_ADDRESS: "${AGENT_GRPC_PUBLIC_ADDRESS:-}"
      MONITOR_ME_PUBLIC_API_URL: "${MONITOR_ME_PUBLIC_API_URL:-http://localhost:8080}"
      MONITOR_ME_AGENT_ARTIFACT_DIR: "/app/.data/agent-artifacts"
      MONITOR_ME_AGENT_CA_FILE: "/run/certs/server.crt"
    volumes:
      - agent_artifacts:/app/.data/agent-artifacts:ro
      - ./.data/certs:/run/certs:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/config || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      agent-artifacts:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  agent_artifacts:
