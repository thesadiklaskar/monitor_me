name: monitor-me-production
services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [private]
  redis:
    image: redis:8.10.3
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks: [private]
  clickhouse:
    image: "${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:26.8.44.3}"
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor_me
      CLICKHOUSE_USER: monitor_me
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: [clickhouse_data:/var/lib/clickhouse]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [private]
  migrate:
    image: "monitor-me-api:${MONITOR_ME_RELEASE:?Set MONITOR_ME_RELEASE}"
    entrypoint: ["/usr/local/bin/monitor-me-migrate"]
    restart: "no"
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
  api:
    image: "monitor-me-api:${MONITOR_ME_RELEASE:?Set MONITOR_ME_RELEASE}"
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      SERVICE_VERSION: "${MONITOR_ME_RELEASE}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      CLICKHOUSE_URL: "http://clickhouse:8123"
      CLICKHOUSE_USER: "monitor_me"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}"
      WEB_ALLOWED_ORIGINS: "https://${PUBLIC_HOSTNAME:?Set PUBLIC_HOSTNAME}"
      REMOTE_ALLOWED_SYSTEMD_UNITS: "${REMOTE_ALLOWED_SYSTEMD_UNITS:-}"
      AGENT_GRPC_ADDR: ":8443"
      AGENT_TLS_CERT_FILE: "/run/certs/fullchain.pem"
      AGENT_TLS_KEY_FILE: "/run/certs/privkey.pem"
    group_add:
      - "${CERT_GROUP_ID:-15001}"
    ports:
      - "127.0.0.1:${API_HTTP_BIND_PORT:-18080}:8080"
      - "${AGENT_GRPC_BIND_ADDRESS:-0.0.0.0}:${AGENT_GRPC_PORT:-8443}:8443"
    volumes:
      - "${AGENT_TLS_CERT_DIR:-/var/lib/monitor-me/certs}:/run/certs:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [private]
  agent-artifacts:
    image: "monitor-me-agent-artifacts:${MONITOR_ME_RELEASE:?Set MONITOR_ME_RELEASE}"
    build:
      context: ../..
      dockerfile: deploy/agent-artifacts/Dockerfile
      args:
        MONITOR_AGENT_VERSION: "${MONITOR_ME_RELEASE:?Set MONITOR_ME_RELEASE}"
    restart: "no"
    volumes:
      - agent_artifacts:/out
    networks: [private]
  web:
    image: "monitor-me-web:${MONITOR_ME_RELEASE:?Set MONITOR_ME_RELEASE}"
    build:
      context: ../../web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      MONITOR_ME_API_BASE_URL: "http://api:8080"
      MONITOR_ME_AGENT_GRPC_ADDRESS: "${AGENT_GRPC_PUBLIC_ADDRESS:?Set AGENT_GRPC_PUBLIC_ADDRESS}"
      MONITOR_ME_PUBLIC_API_URL: "https://${PUBLIC_HOSTNAME}"
      MONITOR_ME_AGENT_ARTIFACT_DIR: "/app/.data/agent-artifacts"
      MONITOR_ME_AGENT_CA_FILE: "/run/certs/fullchain.pem"
    volumes:
      - agent_artifacts:/app/.data/agent-artifacts:ro
      - "${AGENT_TLS_CERT_DIR:-/var/lib/monitor-me/certs}:/run/certs:ro"
    ports:
      - "127.0.0.1:${WEB_BIND_PORT:-13000}:3000"
    depends_on:
      api:
        condition: service_healthy
      agent-artifacts:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/config || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [private]
volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  agent_artifacts:
networks:
  private:
    driver: bridge
