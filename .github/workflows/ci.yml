      - name: Verify anonymous local dashboard mode
        env:
          MONITOR_ME_AUTH_DISABLED: "true"
        shell: bash
        run: |
          docker compose up --build -d api web
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/config -o /tmp/monitor-me-anonymous-config.json; then
              break
            fi
            sleep 2
          done
          jq -e '.auth_disabled == true' /tmp/monitor-me-anonymous-config.json
          curl --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 \
            --connect-timeout 3 --max-time 10 -fsS \
            http://127.0.0.1:3000/api/auth/me -o /tmp/monitor-me-anonymous-user.json
          jq -e '.user.role == "owner" and .user.organization_id != ""' /tmp/monitor-me-anonymous-user.json
          status=""
          if ! status="$(curl --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 \
            --connect-timeout 3 --max-time 10 -sS -o /tmp/monitor-me-anonymous-login.json -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data '{"email":"disabled@example.invalid","password":"not-used"}' \
            http://127.0.0.1:3000/api/auth/login 2>/tmp/monitor-me-anonymous-login-curl.log)"; then
            cat /tmp/monitor-me-anonymous-login-curl.log
            exit 1
          fi
          if [ "$status" != "404" ]; then
            echo "Expected login to be disabled with HTTP 404, got HTTP $status."
            cat /tmp/monitor-me-anonymous-login.json
            exit 1
          fi
          jq -e '.error.code == "authentication_disabled"' /tmp/monitor-me-anonymous-login.json
