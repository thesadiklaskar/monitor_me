name: CI

on:
  push:
    branches:
      - main
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.mod
      - name: Install Protocol Buffers compiler and Go generators
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generate versioned gRPC sources
        run: sh scripts/generate-proto.sh
      - name: Resolve and verify Go module graph
        working-directory: backend
        run: |
          go mod tidy
          go mod verify
      - name: Format check
        working-directory: backend
        run: |
          formatting_files="$(gofmt -l .)"
          if [ -n "$formatting_files" ]; then
            printf 'The following files need gofmt:\n%s\n' "$formatting_files"
            gofmt -d .
            exit 1
          fi
      - name: Run unit tests
        working-directory: backend
        run: go test -race -cover ./...
      - name: Run static analysis
        working-directory: backend
        run: go vet ./...
      - name: Build API and migration runner
        working-directory: backend
        run: |
          go build -trimpath ./cmd/api
          go build -trimpath ./cmd/migrate
      - name: Benchmark live event preparation
        working-directory: backend
        run: go test -run '^$' -bench BenchmarkPublishCommittedBatch -benchmem -benchtime=3s ./internal/telemetry

  agent:
    name: Native Linux agent checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: agent/go.mod
      - name: Install Protocol Buffers compiler and Go generators
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generate versioned gRPC sources for both modules
        run: sh scripts/generate-proto.sh
      - name: Resolve and verify agent module graph
        working-directory: agent
        run: |
          go mod tidy
          go mod verify
      - name: Format check
        working-directory: agent
        run: |
          formatting_files="$(gofmt -l .)"
          if [ -n "$formatting_files" ]; then
            printf 'The following files need gofmt:\n%s\n' "$formatting_files"
            gofmt -d .
            exit 1
          fi
      - name: Run race-enabled unit tests
        working-directory: agent
        run: go test -race -cover ./...
      - name: Run static analysis
        working-directory: agent
        run: go vet ./...
      - name: Build native agent
        working-directory: agent
        run: go build -trimpath -o /tmp/monitor-me-agent ./cmd/monitor-agent
      - name: Validate Linux systemd service
        run: |
          sudo install -m 0755 /tmp/monitor-me-agent /usr/local/bin/monitor-agent
          systemd-analyze verify agent/deploy/systemd/monitor-me-agent.service
      - name: Benchmark Linux collection and durable spool
        working-directory: agent
        run: go test -run '^$' -bench 'Benchmark(ProcCollectorCollect|CounterRate|SpoolAppend)' -benchmem -benchtime=3s ./internal/collector ./internal/spool
  frontend:
    name: Next.js frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        working-directory: web
        run: npm run lint
      - name: Check TypeScript
        working-directory: web
        run: npm run typecheck
      - name: Build frontend
        working-directory: web
        run: npm run build

  compose:
    name: Docker Compose integration
    runs-on: ubuntu-latest
    env:
      MONITOR_ME_AUTH_DISABLED: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare local environment
        run: cp .env.example .env
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache-dependency-path: backend/go.mod
      - name: Install gRPC client generators
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          sh scripts/generate-proto.sh
      - name: Resolve dependencies for integration tests
        working-directory: backend
        run: |
          go mod tidy
          go mod verify
      - name: Generate local TLS certificate
        run: |
          mkdir -p .data/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout .data/certs/server.key \
            -out .data/certs/server.crt \
            -days 2 -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sudo chgrp -R 10001 .data/certs
          chmod 750 .data/certs
          chmod 644 .data/certs/server.crt
          chmod 640 .data/certs/server.key
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start the complete local stack
        run: docker compose up --build -d
      - name: Wait for API readiness
        shell: bash
        run: |
          for attempt in $(seq 1 45); do
            if docker compose exec -T api wget -q -O /dev/null http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1
      - name: Wait for web readiness
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T web wget -q -O /dev/null http://127.0.0.1:3000/api/config; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color web api
          exit 1
      - name: Verify authenticated web-to-API proxy configuration
        shell: bash
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 \
            --connect-timeout 3 --max-time 10 -fsS \
            http://127.0.0.1:3000/api/config -o /tmp/monitor-me-web-config.json
          jq -e '.agent_grpc_address == "localhost:8443" and .public_api_url == "http://localhost:8080"' /tmp/monitor-me-web-config.json
          status=""
          if ! status="$(curl --retry 5 --retry-all-errors --retry-delay 1 --retry-max-time 30 \
            --connect-timeout 3 --max-time 10 -sS -o /tmp/monitor-me-login.json -w '%{http_code}' \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data '{"email":"missing-user@example.invalid","password":"invalid-test-password"}' \
            http://127.0.0.1:3000/api/auth/login 2>/tmp/monitor-me-login-curl.log)"; then
            echo "The web-to-API login proxy request failed after retries."
            cat /tmp/monitor-me-login-curl.log
            docker compose ps --all
            docker compose logs --no-color web api
            exit 1
          fi
          if [ "$status" != "401" ]; then
            echo "Expected the proxy to return HTTP 401, got HTTP $status."
            cat /tmp/monitor-me-login.json
            docker compose ps --all
            docker compose logs --no-color web api
            exit 1
          fi
      - name: Exercise user authentication and TLS agent enrollment
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://monitor_me:local_only_change_me@127.0.0.1:5432/monitor_me?sslmode=disable
          API_BASE_URL: http://127.0.0.1:8080
          AGENT_GRPC_ADDRESS: localhost:8443
          AGENT_GRPC_ROOT_CA: ${{ github.workspace }}/.data/certs/server.crt
          TEST_REDIS_ADDRESS: localhost:6379
          TEST_REDIS_PASSWORD: local_only_change_me
        run: go test -tags=integration -v ./integration
      - name: Benchmark TLS gRPC to PostgreSQL ingestion
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://monitor_me:local_only_change_me@127.0.0.1:5432/monitor_me?sslmode=disable
          AGENT_GRPC_ADDRESS: localhost:8443
          AGENT_GRPC_ROOT_CA: ${{ github.workspace }}/.data/certs/server.crt
        run: go test -tags=integration -run 'NoMatchingTestNames' -bench 'BenchmarkPhase3PostgresIngestion' -benchmem -benchtime=3s ./integration
      - name: Verify anonymous local dashboard mode
        env:
          MONITOR_ME_AUTH_DISABLED: "true"
        shell: bash
        run: |
          docker compose up --build -d api web
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/config -o /tmp/monitor-me-anonymous-config.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          jq -e '.auth_disabled == true' /tmp/monitor-me-anonymous-config.json
          curl -fsS http://127.0.0.1:3000/api/auth/me -o /tmp/monitor-me-anonymous-user.json
          jq -e '.user.role == "owner" and .user.organization_id != ""' /tmp/monitor-me-anonymous-user.json
          curl -sS -o /tmp/monitor-me-anonymous-login.json -w '%{http_code}' -H 'Origin: http://127.0.0.1:3000' -H 'Content-Type: application/json' --data '{"email":"disabled@example.invalid","password":"not-used"}' http://127.0.0.1:3000/api/auth/login | grep -qx '404'
          jq -e '.error.code == "authentication_disabled"' /tmp/monitor-me-anonymous-login.json
      - name: Verify database migration
        run: |
          docker compose exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U monitor_me -d monitor_me \
            -Atc "SELECT to_regclass('public.organizations') IS NOT NULL;" | grep -qx t
      - name: Verify Redis connectivity
        run: |
          docker compose exec -T redis \
            sh -c 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping' | grep -qx PONG
      - name: Verify dependency-aware readiness
        run: docker compose exec -T api wget -q -O - http://127.0.0.1:8080/health/ready
      - name: Verify PostgreSQL durability during Redis outage and recovery
        shell: bash
        run: |
          docker compose stop redis
          if docker compose exec -T api wget -q -O - http://127.0.0.1:8080/health/ready; then
            echo "API readiness must fail while the required Redis dependency is unavailable."
            exit 1
          fi
          docker compose exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U monitor_me -d monitor_me \
            -Atc "SELECT count(*) > 0 FROM users;" | grep -qx t
          docker compose start redis
          for attempt in $(seq 1 30); do
            if docker compose exec -T api wget -q -O /dev/null http://127.0.0.1:8080/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps --all
          docker compose logs --no-color
          exit 1
      - name: Create PostgreSQL durability canary
        run: |
          docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U monitor_me -d monitor_me <<'SQL'
          WITH organization AS (
            INSERT INTO organizations (name, slug)
            VALUES ('PostgreSQL Recovery CI', 'postgres-recovery-ci')
            RETURNING id
          ),
          server AS (
            INSERT INTO servers (organization_id, name, hostname, status)
            SELECT id, 'postgres-recovery-ci', 'postgres-recovery-ci', 'online'
            FROM organization
            RETURNING id, organization_id
          ),
          agent AS (
            INSERT INTO agents (server_id, version, status)
            SELECT id, 'ci-recovery', 'online'
            FROM server
            RETURNING id, server_id
          ),
          batch AS (
            INSERT INTO telemetry_batches (
              agent_id, batch_id, schema_version, payload_hash, collected_at, sample_count
            )
            SELECT id, 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', 1,
                   decode(repeat('ab', 32), 'hex'), now(), 1
            FROM agent
            RETURNING agent_id, batch_id
          )
          INSERT INTO telemetry_samples (
            organization_id, server_id, agent_id, batch_id, metric_name,
            value, unit, labels, observed_at, attribution_method
          )
          SELECT server.organization_id, server.id, agent.id, batch.batch_id,
                 'host.cpu.utilization', 42, 'percent', '{}'::jsonb, now(), 'host_total'
          FROM server
          JOIN agent ON agent.server_id = server.id
          JOIN batch ON batch.agent_id = agent.id;
          SQL
      - name: Verify PostgreSQL outage and recovery
        shell: bash
        run: |
          docker compose stop postgres
          database_unavailable=0
          for attempt in $(seq 1 15); do
            if ! docker compose exec -T api wget -q -O /dev/null http://127.0.0.1:8080/health/ready; then
              database_unavailable=1
              break
            fi
            sleep 1
          done
          if [ "$database_unavailable" -ne 1 ]; then
            echo "API readiness must fail while PostgreSQL is unavailable."
            exit 1
          fi
          docker compose start postgres
          database_recovered=0
          for attempt in $(seq 1 30); do
            if docker compose exec -T api wget -q -O /dev/null http://127.0.0.1:8080/health/ready; then
              database_recovered=1
              break
            fi
            sleep 2
          done
          if [ "$database_recovered" -ne 1 ]; then
            docker compose ps --all
            docker compose logs --no-color
            exit 1
          fi
          docker compose exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U monitor_me -d monitor_me \
            -Atc "SELECT count(*) = 1 FROM telemetry_samples sample JOIN organizations organization ON organization.id = sample.organization_id WHERE organization.slug = 'postgres-recovery-ci' AND sample.batch_id = 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';" | grep -qx t
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local stack
        if: always()
        run: docker compose down --volumes
 -bench '^BenchmarkPhase3PostgresIngestion      - name: Verify anonymous local dashboard mode
